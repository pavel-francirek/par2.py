[project]
name = "par2-py"
description = "Simple script for file data integrity checks using par2"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["par2"]

[tool.pyright]
extraPaths = ["bin"]
